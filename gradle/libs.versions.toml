[versions]
# Core / Plugins
agp = "8.13.2"
kotlin = "2.3.0"

# AndroidX
activityKtx = "1.12.4"
appcompat = "1.7.1"
browser = "1.9.0"
datastorePreferences = "1.2.0"
fragmentKtx = "1.8.9"
multidex = "2.0.1"
paletteKtx = "1.0.0"
splashscreen = "1.2.0"
startupRuntime = "1.2.0"

# Lifecycle
lifecycle = "2.10.0"

# Compose
compose-bom = "2026.02.00"

# Hilt
hiltAndroid = "2.57.2"
hiltNavigationCompose = "1.3.0"

# Others
coil = "3.4.0"
crashreport = "4.1.9.3"
kotlinxCoroutinesAndroid = "1.10.2"
ktor = "3.3.3"
media3 = "1.9.2"
navigationCompose = "2.9.7"
paging = "3.4.1"
room = "2.8.4"
work = "2.11.1"

[libraries]
# AndroidX
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "activityKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastorePreferences" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
androidx-palette-ktx = { module = "androidx.palette:palette-ktx", version.ref = "paletteKtx" }
androidx-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-startup-runtime = { module = "androidx.startup:startup-runtime", version.ref = "startupRuntime" }

# Compose
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-animation = { module = "androidx.compose.animation:animation" }
compose-material = { module = "androidx.compose.material:material" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-material-navigation = { module = "androidx.compose.material:material-navigation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-runtime-livedata = { module = "androidx.compose.runtime:runtime-livedata" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-util = { module = "androidx.compose.ui:ui-util" }

# Coil
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil" }

# Hilt
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hiltAndroid" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroid" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }

# Ktor
ktor-client-android = { module = "io.ktor:ktor-client-android", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }

# Lifecycle
lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-service = { module = "androidx.lifecycle:lifecycle-service", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }

# Media3
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }

# Navigation
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# Paging
paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }

# Room
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }

# Work
work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }

# Others
crashreport = { module = "com.tencent.bugly:crashreport", version.ref = "crashreport" }

[bundles]
androidx = [
    "androidx-activity-ktx",
    "androidx-appcompat",
    "androidx-browser",
    "androidx-datastore-preferences",
    "androidx-fragment-ktx",
    "androidx-multidex",
    "androidx-palette-ktx",
    "androidx-splashscreen",
    "androidx-startup-runtime"
]
coil = [
    "coil-compose",
    "coil-network-ktor3"
]
compose = [
    "compose-animation",
    "compose-material",
    "compose-material-icons-extended",
    "compose-material-navigation",
    "compose-material3",
    "compose-runtime-livedata",
    "compose-ui",
    "compose-ui-tooling-preview",
    "compose-ui-util"
]
hilt = [
    "hilt-android",
    "hilt-navigation-compose"
]
lifecycle = [
    "lifecycle-livedata-ktx",
    "lifecycle-runtime-compose",
    "lifecycle-runtime-ktx",
    "lifecycle-service",
    "lifecycle-viewmodel-compose",
    "lifecycle-viewmodel-ktx"
]
kotlin = [
    "kotlin-stdlib",
    "kotlinx-coroutines-android"
]
ktor = [
    "ktor-client-android",
    "ktor-client-content-negotiation",
    "ktor-client-core",
    "ktor-serialization-kotlinx-json"
]
media3 = [
    "media3-datasource",
    "media3-exoplayer",
    "media3-ui"
]
paging = [
    "paging-compose",
    "paging-runtime-ktx"
]
room = [
    "room-ktx",
    "room-paging",
    "room-runtime"
]

[plugins]
application = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hiltAndroid" }
ksp = { id = "com.google.devtools.ksp", version.ref = "kotlin" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
